# =============================================================================
# awning-shades — the live config for the AUTOSHADE board (ESP32-S3 USB host).
# Paste into the HA ESPHome Builder; keep your own secrets.
#
# Everything below `esphome:` follows example/autoshade.yaml, plus:
#   * Mark Selected Down / Up: tell the ESP where a shade physically is,
#     without moving it.
#   * Motor Speed / Acceleration sliders (full steps; the board half-steps).
#   * Update Board Firmware: reflashes the board's ATmega328P over USB with
#     the autoshade_dumb.hex bundled in this component. No laptop needed.
#
# Steps per inch: the old "2124 steps/ft" (177/in) is ~1.35x too high for
# these shades; measured values are 126-139. Measure yours (jog 10 in, tape
# it) and set steps_per_inch.
# =============================================================================

substitutions:
  steps_per_inch: "130"
  steps_per_foot: "1560"   # steps_per_inch * 12

esphome:
  name: awning-shades
  friendly_name: awning-shades

esp32:
  # `variant` is preferred over `board` in current ESPHome. N16R8 = 16 MB
  # flash, 8 MB PSRAM. PSRAM is deliberately not enabled — nothing here needs
  # it, and octal PSRAM misconfiguration is a common boot-loop cause.
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

external_components:
  # Pulled straight from GitHub - nothing to copy into /config/esphome.
  # refresh: 0s re-fetches on every build, which is what you want while the
  # component is still changing. Drop it (default 1day) once it is stable.
  - source: github://bassrock/esphome-autoshade@main
    components: [autoshade_link]
    refresh: 0s

  # Local alternative, if you would rather keep the files in
  # /config/esphome/components/autoshade_link/ :
  # - source:
  #     type: local
  #     path: components

logger:
  level: INFO
  # Out the UART bridge (the COM port). The native USB peripheral is the host.
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Autoshade Fallback"

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

sun:
  latitude: 37.0058
  longitude: -121.5683      # set to your actual location
  on_sunset:
    - elevation: -2.0
      then:
        - script.execute: all_down

# -----------------------------------------------------------------------------
# USB host
#
# No board control pins here — unlike the ESP32-S3-USB-OTG kit, this board has
# no USB mux and no VBUS switch. D+/D- go straight to the breakout and VBUS is
# hard-wired from the 5 V pin, so the jack is live the moment the board powers
# up. That also means there is no way to switch it off in software.
#
# First boot: leave vid/pid at 0 so any CDC-ACM device matches, read the log to
# see what the '16U2 enumerates as, then pin those values.
# -----------------------------------------------------------------------------

usb_host:

usb_uart:
  - type: cdc_acm
    vid: 0
    pid: 0
    channels:
      - id: avr_uart
        baud_rate: 115200
        buffer_size: 1024

autoshade_link:
  id: avr
  uart_id: avr_uart
  usb_channel: avr_uart     # lets the ESP reset the board to update its firmware
  update_interval: 500ms
  supply_voltage:
    name: Shade Controller 12V
    id: v_supply
  battery_voltage:
    name: Shade Controller Backup Battery

# -----------------------------------------------------------------------------
# Everything below is identical to autoshade.yaml.
# -----------------------------------------------------------------------------

cover:
  - platform: autoshade_link
    id: shade_1
    name: Shade 1
    motor: 1
    travel_steps: 9360      # 6 ft at 130 steps/in; Set Top/Bottom Here replaces it
    hold: brake
    home_overrun: 150

  - platform: autoshade_link
    id: shade_2
    name: Shade 2
    motor: 2
    travel_steps: 9360
    hold: brake
    home_overrun: 150

  - platform: autoshade_link
    id: shade_3
    name: Shade 3
    motor: 3
    travel_steps: 9360
    hold: brake
    home_overrun: 150

  - platform: autoshade_link
    id: shade_4
    name: Shade 4
    motor: 4
    travel_steps: 9360
    hold: brake
    home_overrun: 150

  - platform: autoshade_link
    id: shade_5
    name: Shade 5
    motor: 5
    travel_steps: 9360
    hold: brake
    home_overrun: 150

binary_sensor:
  # Is the shade board actually talking to us? This is the first thing to look
  # at if nothing works — it goes off after 5 s of silence on the link.
  - platform: template
    name: "Controller Link"
    device_class: connectivity
    lambda: 'return id(avr)->is_linked();'

  - platform: autoshade_link
    button: up
    name: Panel Up
    on_press:
      - script.execute: all_up

  - platform: autoshade_link
    button: down
    name: Panel Down
    on_press:
      - script.execute: all_down

  - platform: autoshade_link
    button: select
    name: Panel Select
    on_press:
      - script.execute: stop_all

  - platform: autoshade_link
    button: left
    name: Panel Left

  - platform: autoshade_link
    button: right
    name: Panel Right

script:
  - id: all_up
    mode: restart
    then:
      - cover.open: shade_1
      - cover.open: shade_2
      - cover.open: shade_3
      - cover.open: shade_4
      - cover.open: shade_5

  - id: all_down
    mode: restart
    then:
      - cover.close: shade_1
      - cover.close: shade_2
      - cover.close: shade_3
      - cover.close: shade_4
      - cover.close: shade_5

  - id: stop_all
    mode: restart
    then:
      - lambda: 'id(avr)->send_stop(0);'

# -----------------------------------------------------------------------------
# Shade setup, all from HA (device page -> Configuration). No YAML edits needed
# after the first flash; everything below is saved on the ESP and survives
# reboots and reflashes.
#
#   1. Setup Shade: pick the shade.
#   2. Jog Up / Jog Down (by Jog Distance) until the bottom bar is where you
#      want "fully open". Press Set Top Here.
#   3. Jog Down to where you want "fully closed" (a big Jog Distance gets you
#      most of the way). Press Set Bottom Here.
#   Or type the drop straight into "Shade N Length" if you know it.
#
# Set Top Here keeps the bottom where it physically was, so the two can be
# done in either order and redone independently.
# -----------------------------------------------------------------------------

number:
  - platform: autoshade_link
    cover_id: shade_1
    name: Shade 1 Length
    steps_per_foot: ${steps_per_foot}
  - platform: autoshade_link
    cover_id: shade_2
    name: Shade 2 Length
    steps_per_foot: ${steps_per_foot}
  - platform: autoshade_link
    cover_id: shade_3
    name: Shade 3 Length
    steps_per_foot: ${steps_per_foot}
  - platform: autoshade_link
    cover_id: shade_4
    name: Shade 4 Length
    steps_per_foot: ${steps_per_foot}
  - platform: autoshade_link
    cover_id: shade_5
    name: Shade 5 Length
    steps_per_foot: ${steps_per_foot}

  - platform: template
    id: jog_in
    name: Jog Distance
    entity_category: config
    icon: mdi:arrow-up-down
    unit_of_measurement: in
    mode: box
    min_value: 0.25
    max_value: 60
    step: 0.25
    initial_value: 2
    optimistic: true
    restore_value: true

  # Full steps/s for every shade, from the next move. The board half-steps,
  # so the motor sees twice this. 150+ grinds; 90 is the tested sweet spot.
  - platform: template
    id: motor_speed
    name: Motor Speed
    entity_category: config
    icon: mdi:speedometer
    unit_of_measurement: steps/s
    mode: slider
    min_value: 25
    max_value: 150
    step: 5
    initial_value: 90
    optimistic: true
    restore_value: true
    on_value:
      - lambda: 'id(avr)->set_all_speed((uint16_t) x);'

  # Full steps/s^2. Lower = gentler start and stop, fewer lost steps.
  - platform: template
    id: motor_accel
    name: Acceleration
    entity_category: config
    icon: mdi:gauge-fast
    unit_of_measurement: steps/s²
    mode: slider
    min_value: 25
    max_value: 400
    step: 25
    initial_value: 100
    optimistic: true
    restore_value: true
    on_value:
      - lambda: 'id(avr)->set_all_accel((uint16_t) x);'

  # Peak winding current for the PWM drive modes. The DRV8871s cap it near
  # 1.6 A no matter what; less is quieter and cooler, with less torque.
  # On/off modes always run at that ~1.6 A.
  - platform: template
    id: motor_current
    name: Motor Current
    entity_category: config
    icon: mdi:current-dc
    unit_of_measurement: A
    mode: slider
    min_value: 0.4
    max_value: 1.6
    step: 0.1
    initial_value: 1.2
    optimistic: true
    restore_value: true
    on_value:
      - lambda: 'id(avr)->set_drive_current(x);'

  # Cable resistance to the motors, per winding (there and back). The PWM
  # modes size their duty for motor + cable + driver, so if they hum without
  # turning, this is too low. To measure: 12 V off, meter across one coil pair
  # at the board's terminal block, minus 0.92 (the motor's own winding).
  - platform: template
    id: wiring_resistance
    name: Motor Wiring Resistance
    entity_category: config
    icon: mdi:omega
    unit_of_measurement: Ω
    mode: box
    min_value: 0
    max_value: 10
    step: 0.1
    initial_value: 1.5
    optimistic: true
    restore_value: true
    on_value:
      - lambda: 'id(avr)->set_wiring_resistance(x);'

select:
  # How the board drives the windings (board firmware 3.4+). Applied as soon
  # as every shade is at rest. Compare by ear:
  #   Half step            on/off coils; v3.3's drive
  #   Half step, even      sine PWM at 1/2: every half step the same torque
  #   1/4 microstep        sine PWM
  #   1/8 microstep        sine PWM, smoothest; speed capped near 97 steps/s
  #   Full step            on/off, both coils always on; for comparison
  # PWM modes run at ~1.5 kHz (the PCA9685's limit), so expect a faint whine.
  - platform: template
    id: drive_mode
    name: Drive Mode
    entity_category: config
    icon: mdi:sine-wave
    options:
      - Half step
      - Half step, even
      - 1/4 microstep
      - 1/8 microstep
      - Full step
    initial_option: Half step
    optimistic: true
    restore_value: true
    on_value:
      - lambda: |-
          static const uint8_t divs[] = {2, 2, 4, 8, 1};
          static const bool pwms[] = {false, true, true, true, false};
          const size_t k = i < 5 ? i : 0;
          id(avr)->set_drive(divs[k], pwms[k]);

  - platform: template
    id: setup_shade
    name: Setup Shade
    entity_category: config
    icon: mdi:blinds
    # Same order as the cover: list above.
    options: ["Shade 1", "Shade 2", "Shade 3", "Shade 4", "Shade 5"]
    initial_option: "Shade 1"
    optimistic: true
    restore_value: true

button:
  # Reflash the board's ATmega328P with the firmware bundled in this ESP image
  # (see "Bundled Board Firmware"). Takes ~10 s. Refused while a shade moves.
  - platform: template
    name: Update Board Firmware
    entity_category: diagnostic
    icon: mdi:chip
    on_press:
      - lambda: 'id(avr)->start_avr_update();'

  # Prints the first 64 bytes of the board's EEPROM to the ESPHome log, where
  # the stock firmware kept its settings (shade drop lengths, etc.). Needs board
  # firmware 3.2. Diagnostic only, so it lives under the device's config section.
  - platform: template
    name: "Dump Stock EEPROM"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(avr)->send_raw("R 0 16");
          id(avr)->send_raw("R 16 16");
          id(avr)->send_raw("R 32 16");
          id(avr)->send_raw("R 48 16");

  # --- setup buttons: act on whichever shade "Setup Shade" points at ---
  - platform: template
    name: Jog Up
    entity_category: config
    icon: mdi:arrow-up-bold
    on_press:
      - lambda: |-
          auto *c = id(avr)->cover_at(id(setup_shade).active_index().value_or(0));
          if (c) c->jog(-lroundf(id(jog_in).state * ${steps_per_inch}.0f));

  - platform: template
    name: Jog Down
    entity_category: config
    icon: mdi:arrow-down-bold
    on_press:
      - lambda: |-
          auto *c = id(avr)->cover_at(id(setup_shade).active_index().value_or(0));
          if (c) c->jog(lroundf(id(jog_in).state * ${steps_per_inch}.0f));

  - platform: template
    name: Set Top Here
    entity_category: config
    icon: mdi:format-vertical-align-top
    on_press:
      - lambda: |-
          auto *c = id(avr)->cover_at(id(setup_shade).active_index().value_or(0));
          if (c) c->set_top_here();

  - platform: template
    name: Set Bottom Here
    entity_category: config
    icon: mdi:format-vertical-align-bottom
    on_press:
      - lambda: |-
          auto *c = id(avr)->cover_at(id(setup_shade).active_index().value_or(0));
          if (c) c->set_bottom_here();

  # Tell the ESP where the selected shade physically is, without moving it.
  - platform: template
    name: Mark Selected Down
    entity_category: config
    icon: mdi:arrow-collapse-down
    on_press:
      - lambda: |-
          auto *c = id(avr)->cover_at(id(setup_shade).active_index().value_or(0));
          if (c) c->mark_position(0.0f);

  - platform: template
    name: Mark Selected Up
    entity_category: config
    icon: mdi:arrow-collapse-up
    on_press:
      - lambda: |-
          auto *c = id(avr)->cover_at(id(setup_shade).active_index().value_or(0));
          if (c) c->mark_position(1.0f);

  - platform: template
    name: Home Selected Shade
    entity_category: config
    icon: mdi:home-import-outline
    on_press:
      - lambda: |-
          auto *c = id(avr)->cover_at(id(setup_shade).active_index().value_or(0));
          if (c) c->start_home();

  # Only if the top you set IS a physical stop the bar can safely bump.
  - platform: template
    name: "Re-home All Shades"
    entity_category: config
    on_press:
      - lambda: |-
          id(shade_1)->start_home();
          id(shade_2)->start_home();
          id(shade_3)->start_home();
          id(shade_4)->start_home();
          id(shade_5)->start_home();

text_sensor:
  - platform: template
    name: Board Firmware
    entity_category: diagnostic
    icon: mdi:chip
    update_interval: 5s
    lambda: 'return id(avr)->board_version();'
  - platform: template
    name: Bundled Board Firmware
    entity_category: diagnostic
    icon: mdi:package-variant
    update_interval: 60s
    lambda: 'return id(avr)->bundled_version();'
  - platform: template
    name: Board Update Status
    entity_category: diagnostic
    update_interval: 2s
    lambda: 'return id(avr)->avr_update_status();'

interval:
  - interval: 2s
    then:
      - lambda: |-
          static std::string last0, last1;
          static uint8_t lastbl = 0xFF;
          if (!id(avr)->is_linked()) return;
          if (id(avr)->take_lcd_redraw()) {   // after a board reset, and every minute
            last0.clear(); last1.clear(); lastbl = 0xFF;
          }

          const std::vector<esphome::cover::Cover *> shades = {
            id(shade_1), id(shade_2), id(shade_3), id(shade_4), id(shade_5)
          };

          int up = 0, dn = 0, mid = 0, moving = 0;
          for (size_t i = 0; i < shades.size(); i++) {
            auto *s = shades[i];
            if (s->current_operation != esphome::cover::COVER_OPERATION_IDLE && moving == 0)
              moving = (int) i + 1;
            if (s->position > 0.98f) up++;
            else if (s->position < 0.02f) dn++;
            else mid++;
          }

          char l0[20], l1[20];
          if (moving > 0) {
            snprintf(l0, sizeof(l0), "Moving shade %d", moving);
          } else if (id(ha_time).now().is_valid()) {
            snprintf(l0, sizeof(l0), "%s", id(ha_time).now().strftime("%a %H:%M").c_str());
          } else {
            snprintf(l0, sizeof(l0), "AUTOSHADE");
          }
          snprintf(l1, sizeof(l1), "Up:%d Dn:%d Mid:%d", up, dn, mid);

          if (last0 != l0) { last0 = l0; id(avr)->send_lcd(0, last0); }
          if (last1 != l1) { last1 = l1; id(avr)->send_lcd(1, last1); }

          uint8_t bl = moving > 0 ? 0x3 : (id(v_supply).state < 9.0f ? 0x1 : 0x2);
          if (bl != lastbl) { lastbl = bl; id(avr)->send_backlight(bl); }

# -----------------------------------------------------------------------------
# Notes
#
# * The shade board (firmware 3.2+) is the source of truth for position. It
#   saves to EEPROM every time a motor stops, and the ESP reads positions from
#   it on connect. The ESP only pushes its own copy if the board has nothing
#   saved, runs older firmware, or reset part-way through a move.
#
# * Nothing can move a shade unless 12 V is present at J5: that is where the
#   DRV8871 VM rails come from. For bench work, leave 12 V unplugged and the
#   motors are physically unable to turn no matter what the software does.
#
# * Wrong direction on a shade means swapping one coil pair at its terminal
#   block. There is no software invert — direction is a property of the wiring.
#
# * PSRAM is deliberately not enabled. Nothing here needs it, and misconfigured
#   octal PSRAM is a common boot-loop cause on N16R8 boards.
# -----------------------------------------------------------------------------
